name: Publish trudesk-base (GHCR)

# Publica la imagen lógica en GitHub Packages.
# Ejecutar manualmente la PRIMERA vez (y cuando cambie lógica/deps).
# Los deploys de look & feel NO deben disparar este workflow.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Dockerfile.base
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - .yarn/releases/**

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: trudesk-custom-base

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          # Strip UTF-8 BOM / whitespace (Windows PowerShell WriteAllText/Set-Content can add U+FEFF)
          version=$(sed 's/^\xef\xbb\xbf//' VERSION | tr -d ' \r\n')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${version}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
